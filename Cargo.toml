[workspace]
resolver = "2"
members = [
    # Applications
    "apps/brick",
    "apps/slate",
    "apps/frame",
    "apps/etch",
    # Shared suite infrastructure
    "crates/suite-core",
    "crates/suite-ui",
    "crates/suite-platform",
    "crates/suite-file",
    "crates/suite-update",
    # Brick-only crates
    "apps/brick/crates/csv-engine",
    "apps/brick/crates/formula",
    "apps/brick/crates/data-model",
    "apps/brick/crates/grid",
    "apps/brick/crates/commands",
    "apps/brick/crates/file-format",
    "apps/brick/crates/jobs",
    "apps/brick/crates/xlsx",
    # Slate-only crates
    "apps/slate/crates/document-model",
    "apps/slate/crates/docx",
    "apps/slate/crates/flow",
    "apps/slate/crates/document-edit",
    # Frame-only crates
    "apps/frame/crates/presentation-model",
    "apps/frame/crates/pptx",
    "apps/frame/crates/deck-edit",
    # Etch-only crates
    "apps/etch/crates/image-model",
    "apps/etch/crates/image-io",
]

# `version` is Brick's release version (scripts/ship.sh bumps it); Brick and its crates
# inherit it. Slate, Frame, Etch, and the suite-* crates set their own.
[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/avdrav1/cronkite"
rust-version = "1.92"

[workspace.dependencies]
# Shared suite crates
suite-core = { path = "crates/suite-core" }
suite-ui = { path = "crates/suite-ui" }
suite-platform = { path = "crates/suite-platform" }
suite-file = { path = "crates/suite-file" }
suite-update = { path = "crates/suite-update" }
# Brick crates
csv-engine = { path = "apps/brick/crates/csv-engine" }
data-model = { path = "apps/brick/crates/data-model" }
formula = { path = "apps/brick/crates/formula" }
grid = { path = "apps/brick/crates/grid" }
commands = { path = "apps/brick/crates/commands" }
file-format = { path = "apps/brick/crates/file-format" }
jobs = { path = "apps/brick/crates/jobs" }
xlsx = { path = "apps/brick/crates/xlsx" }
# Slate crates
document-model = { path = "apps/slate/crates/document-model" }
docx = { path = "apps/slate/crates/docx" }
flow = { path = "apps/slate/crates/flow" }
document-edit = { path = "apps/slate/crates/document-edit" }
# Frame crates
presentation-model = { path = "apps/frame/crates/presentation-model" }
pptx = { path = "apps/frame/crates/pptx" }
deck-edit = { path = "apps/frame/crates/deck-edit" }
# Etch crates
image-model = { path = "apps/etch/crates/image-model" }
image-io = { path = "apps/etch/crates/image-io" }
# The suite's UI toolkit (docs/adr/0002-gtk4-for-the-suite.md); v4_14 matches Ubuntu 24.04's GTK.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
# Every app logs through these.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
# Slate's clipboard format: document fragments as JSON.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Etch's image codecs: pure Rust, only the formats Etch opens and saves.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# The Windows API, for the little the apps call directly (WIN-3); each crate names its features.
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
debug = true
