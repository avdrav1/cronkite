[package]
name = "slate"
description = "A lightweight Linux-native word processor"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
suite-core.workspace = true
suite-ui.workspace = true
suite-platform.workspace = true
suite-file.workspace = true
suite-update.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
document-model.workspace = true
document-edit.workspace = true
docx.workspace = true
flow.workspace = true
# Crash recovery journals: the document's blocks as JSON (SLATE-17).
serde.workspace = true
serde_json.workspace = true
# UI toolkit: GTK 4 for the whole suite (docs/adr/0002-gtk4-for-the-suite.md).
gtk.workspace = true
# Only to turn on Pango 1.50's line-height attributes in GTK's Pango (`gtk::pango`), for
# exact and least line spacing; Ubuntu 24.04 has Pango 1.52.
pango = { version = "0.22", features = ["v1_50"] }

[lints]
workspace = true

[[bin]]
name = "slate"
path = "src/main.rs"
bench = false
